services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_BASE_URL=http://localhost:8000
      - FRONTEND_BASE_URL=http://localhost:5173
      - EMAIL_ALLOWLIST=sushdevop07@gmail.com
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

